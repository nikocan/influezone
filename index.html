<!doctype html>
<html lang="tr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7047EB" />
    <meta name="description" content="Shopfluence — Etkinin gelire dönüştüğü yer. Küresel içerik üretici ticaret ağı." />
    <title>Shopfluence</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('sf.prefs') || '{}').theme || 'system';
        var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (d) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
